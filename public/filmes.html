<!DOCTYPE html>
<html lang="pt">

<head>
	<meta charset="UTF-8">
	<title>Gestão de Filmes e Séries</title>
	<link rel="stylesheet" href="css/default.css">
</head>

<body>

	<header>
		<h1>Gestão de Filmes e Séries</h1>

		<nav>
			<a href="index.html">Home</a>
			<a href="filmes.html">Filmes</a>
			<a href="series.html">Séries</a>
			<a href="favoritos.html">Favoritos</a>
			<a href="#" id="btnLogin">Login</a>
		</nav>
	</header>

	<main class="filmes-page">
		<div class="search-bar">
			<input type="text" id="searchInput" placeholder="Pesquisar filmes..." />
			<select id="genreSelect">
				<option value="">Todos os géneros</option>
			</select>
		</div>

		<div id="filmesContainer" class="filmes-grid"></div>
	</main>

	<section class="section">
		<h2>Trending</h2>

		<div class="movies" id="listaFilmes"></div>
	</section>

	<footer>
		<p>
			Projeto de Programação e Integração de Serviços<br>
			CTeSP TPSI – 2025/2026
		</p>
	</footer>

	<!--Login / Register Modal-->
	<div id="authModal" class="modal">
		<div class="modal-content">
			<span class="close" id="closeModal">&times;</span>

			<!-- form do login -->
			<form id="loginFormJS">
				<h2>Bem-vindo!</h2>
				<input type="email" placeholder="Email" id="loginemail" required>
				<input type="password" placeholder="Password" id="loginpassword" required>
				<button type="submit" id="submitLogin">Login</button>
				<p>Ainda não tens conta? <span class="link" id="showRegister">Criar conta</span></p>
			</form>

			<!-- form do register -->
			<form id="registerFormJS" style="display:none;">
				<h2>Criar conta</h2>
				<input type="text" placeholder="Nome" id="name" required>
				<input type="email" placeholder="Email" id="email" required>
				<input type="password" placeholder="Password" id="password" required>
				<button type="submit" id="submitRegister">Registar</button>
				<p>Já tens conta? <span class="link" id="showLogin">Login</span></p>
			</form>
		</div>
	</div>

	<script src="js/auth.js"></script>
	<script src="js/filmes.js"></script>

</body>

</html>
